apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmeter-slaves
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jmeter-slave
  template:
    metadata:
      labels:
        app: jmeter-slave
    spec:
      containers:
      - name: jmeter-slave
        image: justb4/jmeter:5.5
        command:
          - /bin/bash
        args:
          - "-c"
          - "jmeter-server"
        ports:
        - containerPort: 1099

